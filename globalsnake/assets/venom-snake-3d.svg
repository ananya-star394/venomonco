<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" fill="none" role="img" aria-labelledby="title desc">
<title id="title">VenomOncoDB molecular serpent</title><desc id="desc">A luminous teal serpent coiled around a molecular network, representing venom biology and structural bioinformatics.</desc>
